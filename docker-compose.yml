# SGTI frontend
#
#   Desarrollo (hot reload):   docker compose --profile dev up --build
#   Producción local (nginx):  docker compose --profile prod up --build -d
#
# Variables: copia .env.example a .env y ajústalas.

name: sgti

services:
  web-dev:
    profiles: [dev]
    container_name: sgti-web-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_DEFAULT_TENANT: ${VITE_DEFAULT_TENANT:-sgti}
      # Necesario en Windows/WSL: los eventos de archivo no cruzan el volumen.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # node_modules propio del contenedor (binarios Linux, no los de Windows)
      - node_modules:/app/node_modules
    restart: unless-stopped

  web:
    profiles: [prod]
    container_name: sgti-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEFAULT_TENANT: ${VITE_DEFAULT_TENANT:-sgti}
    image: sgti-frontend:latest
    ports:
      - "${PROD_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  node_modules:
